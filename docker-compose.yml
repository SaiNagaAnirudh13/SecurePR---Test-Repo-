services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eomp
      POSTGRES_USER: eomp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-eomp-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eomp -d eomp"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://eomp:${POSTGRES_PASSWORD:-local-eomp-only}@db:5432/eomp
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://eomp:${POSTGRES_PASSWORD:-local-eomp-only}@db:5432/eomp
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
